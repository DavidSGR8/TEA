<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<title>Pactos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --fondo:#101014; --sup:#17171D; --sup2:#22222B; --linea:#1E1D25; --pista:#24232D; --borde:#3A3946;
  --texto:#EEEDF3; --tenue:#98969F; --acento:#B45CFF; --acento-texto:#CE95FF; --acento-suave:#311F43;
  --peligro:#E8A090; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:var(--fondo)}
body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body.con-capa{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
h1,h2,h3,p,dl,dd{margin:0}
[hidden]{display:none!important}

#vista{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 20px calc(var(--nav) + 40px + env(safe-area-inset-bottom))}
#vista.con-bp{padding-bottom:calc(var(--nav) + 160px + env(safe-area-inset-bottom))}

/* Cabecera */
.cab{display:grid;grid-template-columns:40px 44px minmax(0,1fr) 44px 40px;align-items:center;min-height:56px}
.cab.simple{grid-template-columns:40px minmax(0,1fr) 40px}
.cab h1{font-size:20px;font-weight:700;text-align:center}
.redondo{width:44px;height:44px;border-radius:50%;background:var(--sup2);display:flex;align-items:center;justify-content:center}
.icono{width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tenue)}
.cab-fecha{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;min-width:0}
.cab-t{font-size:16px;font-weight:600;text-align:center;line-height:1.2}
.cab-t.larga{font-size:14px}
.cab-s{font-size:12px;color:var(--tenue);text-align:center}

/* Anillos */
.anillo{position:relative;flex:none}
.anillo svg{display:block}
.anillo-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.hero-n{font-size:40px;font-weight:700;line-height:1}
.hero-s{font-size:12px;color:var(--tenue);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:31px}
.chip{padding:6px 12px;border-radius:999px;background:var(--sup2);color:#C9C7D3;font-size:13px}
.chip-a{background:var(--acento-suave);color:var(--acento-texto)}

/* Barra compacta (aparece al bajar) */
.compacta{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--fondo);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top);transform:translateY(-100%);visibility:hidden;transition:transform .16s ease,visibility 0s .16s}
.compacta.visible{transform:none;visibility:visible;transition:transform .16s ease}
.comp-in{max-width:520px;margin:0 auto;padding:8px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.comp-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.comp-n{font-size:12px;font-weight:700}
.comp-e{font-size:12px;color:var(--tenue);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-txt{grid-column:span 2;display:flex;flex-direction:column;min-width:0}
.comp-t{font-size:15px;font-weight:600}
.comp-s{font-size:12px;color:var(--tenue)}

/* Avisos de cierre */
.pend{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--acento-suave);border-radius:14px;padding:10px 10px 10px 14px;margin-top:12px}
.pend-t{display:flex;flex-direction:column;min-width:0}
.pend-t strong{font-size:14px;overflow-wrap:anywhere}
.pend-t span{font-size:12px;color:var(--acento-texto)}

/* Lista de pactos */
.lista{margin-top:14px;display:flex;flex-direction:column}
.pacto{display:flex;flex-wrap:wrap;align-items:center;margin:0 -10px;padding:2px 10px;border-bottom:1px solid var(--linea)}
.pacto.sel{background:var(--sup);border-radius:12px;border-bottom-color:transparent}
.pacto-info{flex:1 1 100%;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;min-height:48px;padding:8px 0 0}
.punto{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pacto-txt{display:flex;flex-direction:column;min-width:0}
.pacto-nom{font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.pacto-meta{font-size:12px;color:var(--tenue);margin-top:2px}
.circulos{flex-basis:100%;display:flex;flex-wrap:wrap;justify-content:flex-start;margin:0 0 4px 10px}
.c{width:40px;height:44px;display:flex;align-items:center;justify-content:center}
.c span{width:24px;height:24px;border-radius:50%;border:1.5px solid #77748A}
.c.x span{border-style:dashed}
.c.on span{background:var(--cc,var(--acento));border:1.5px solid var(--cc,var(--acento))}
.centro{display:flex;justify-content:center;margin-top:22px}
.pacto-nota{flex-basis:100%;display:flex;align-items:flex-start;gap:8px;text-align:left;min-height:36px;margin:-4px 0 8px;padding:6px 0 6px 18px;font-size:13px;line-height:1.4;color:#C9C7D3}
.pacto-nota svg{flex:none;margin-top:2px;color:var(--tenue)}
.pacto-nota span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.vacio{text-align:center;padding:28px 12px 4px;color:var(--tenue);font-size:14px}
.vacio strong{display:block;color:var(--texto);font-size:16px;margin-bottom:6px}

/* Botones */
.btn{min-height:46px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-pri{background:var(--acento);color:#15131C}
.btn-borde{border:1.5px solid var(--acento);color:var(--acento-texto)}
.btn-gris{background:var(--sup2);color:var(--texto)}
.btn-rojo{background:var(--peligro);color:#1D0F0B}
.btn-pel{color:var(--peligro)}
.btn-ch{min-height:44px;padding:0 16px;font-size:14px}
.btn-ancho{width:100%;min-height:50px}

/* Opciones del pacto tocado */
.bp{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom));z-index:16;padding:0 12px;pointer-events:none}
.bp-in{pointer-events:auto;max-width:496px;margin:0 auto;background:var(--sup2);border:1px solid var(--borde);border-radius:18px;padding:4px 8px 10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.bp-cab{display:flex;align-items:center;gap:8px}
.bp-nom{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-right:6px}
.bp-b .btn{background:#30303B;padding:4px 8px;font-size:14px;min-height:44px;line-height:1.15}
.bp-nota{padding:0 6px 4px 0}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--fondo);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:flex;padding:4px 4px;height:var(--nav)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--tenue)}
.nav button[aria-current="page"]{color:var(--acento-texto);font-weight:600}

/* Análisis */
.hero-sem{font-size:13px;color:var(--tenue)}
.pildoras{display:flex;justify-content:center;gap:8px;margin-top:18px}
.sub{font-size:13px;color:var(--tenue);margin:-6px 0 12px}
.dist{display:flex;gap:3px;height:18px;border-radius:9px;overflow:hidden}
.dist span{min-width:4px}
.leyenda{display:flex;flex-direction:column;margin-top:10px}
.ley{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid var(--linea);font-size:14px}
.ley-n{flex:1;min-width:0;overflow-wrap:anywhere}
.ley-v{color:var(--tenue);white-space:nowrap}
.ley-v b{color:var(--texto);font-weight:600}
.notas{margin-top:12px;border-top:1px solid var(--linea)}
.notas summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:14px;font-weight:600;color:var(--acento-texto);list-style:none}
.notas summary::-webkit-details-marker{display:none}
.notas ul{list-style:none;margin:0;padding:0 0 4px;display:flex;flex-direction:column;gap:12px}
.notas li span{display:block;font-size:12px;color:var(--tenue)}
.notas li p{font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
textarea{width:100%;min-height:150px;border-radius:14px;border:1.5px solid var(--borde);background:var(--fondo);color:var(--texto);font:inherit;font-size:16px;line-height:1.45;padding:12px 14px;resize:vertical}
textarea::placeholder{color:#7C7A86}
.pil{min-height:44px;padding:0 16px;border-radius:999px;background:var(--sup2);color:var(--tenue);font-weight:600;font-size:14px}
.pil[aria-pressed="true"]{background:var(--acento);color:#15131C}
.graf{margin-top:16px}
.graf svg{display:block}
.graf text{font-size:11px;fill:var(--tenue)}
.graf-e{display:flex;justify-content:space-between;margin:4px 40px 0 0;font-size:12px;color:var(--tenue)}
.sec{margin-top:30px}
.sec>h2{font-size:15px;font-weight:700;margin-bottom:12px}
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tarjeta{width:100%;background:var(--sup);border:1.5px solid transparent;border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tarjeta[aria-pressed="true"]{border-color:var(--acento)}
.tar-p{font-size:17px;font-weight:700}
.tar-n{display:block;font-size:14px;font-weight:600;margin-top:10px;overflow-wrap:anywhere;line-height:1.25}
.tar-d{display:block;font-size:12px;color:var(--tenue);margin-top:4px}
.barras{display:flex;flex-direction:column;gap:10px}
.barra{position:relative;min-height:44px;border-radius:12px;background:var(--sup);overflow:hidden}
.barra-r{position:absolute;left:0;top:0;bottom:0;opacity:.24}
.barra-c{position:relative;min-height:44px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.barra-c span:first-child{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.barra-c b{font-weight:700}

/* Pendientes */
.t-nueva{display:flex;gap:8px;margin-top:8px}
.t-nueva input{flex:1;min-width:0}
.t-mas{width:50px;height:50px;flex:none;border-radius:14px;background:var(--acento);color:#15131C;display:flex;align-items:center;justify-content:center}
.tareas{list-style:none;margin:14px 0 0;padding:0}
.tarea{display:flex;align-items:flex-start;border-bottom:1px solid var(--linea)}
.t-check{width:44px;min-height:52px;flex:none;margin-left:-10px;display:flex;align-items:center;justify-content:center}
.t-check span{width:24px;height:24px;border-radius:7px;border:1.5px solid #77748A;display:flex;align-items:center;justify-content:center;color:#15131C}
.t-check span svg{visibility:hidden}
.t-check[aria-pressed="true"] span{background:var(--acento);border-color:var(--acento)}
.t-check[aria-pressed="true"] span svg{visibility:visible}
.t-txt{flex:1;min-width:0;min-height:52px;padding:15px 0 14px;text-align:left;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-line}
.hechas .t-txt{color:var(--tenue);text-decoration:line-through}
.t-sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px}
.t-sec h2{font-size:14px;font-weight:600;color:var(--tenue)}
.t-sec .btn{margin-right:-16px}
.t-nada{margin-top:18px}

/* Archivo */
.arch{background:var(--sup);border-radius:18px;padding:16px;margin-top:12px}
.arch-cab{display:flex;align-items:center;gap:10px}
.arch-cab h2{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.arch-cat{font-size:12px;color:var(--tenue);margin:2px 0 0 18px}
.arch dl{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.arch dt{font-size:12px;color:var(--tenue)}
.arch dd{font-size:14px}
.arch-b{display:flex;gap:8px;margin-top:14px;align-items:center;justify-content:space-between}

/* Hojas (formularios y diálogos) */
.capa{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.velo{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.hoja{position:relative;width:100%;max-width:520px;margin:0 auto;background:var(--sup);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;padding:6px 20px 0}
.hoja-c{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.capa.completa .hoja-c{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.capa.completa .hoja{height:100%;max-height:100%;border-radius:0;background:var(--fondo);padding-top:calc(6px + env(safe-area-inset-top))}
.capa.dialogo{justify-content:center;padding:24px}
.capa.dialogo .hoja{border-radius:22px;max-width:360px;padding:22px 20px 0;max-height:100%}
.capa.dialogo .hoja-c{padding-bottom:18px}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.hoja-cab h2{font-size:18px;font-weight:700;flex:1;min-width:0}
.capa.completa .hoja-cab h2{text-align:center}
.hoja-cab .icono{margin-right:-10px}
.capa.completa .hoja-cab .icono{margin:0 0 0 -10px}
.hueco{width:30px;flex:none}
.campo{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.etq{font-size:13px;color:var(--tenue);font-weight:500}
input[type="text"]{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--borde);background:var(--fondo);color:var(--texto);font:inherit;font-size:16px;padding:0 14px}
input[type="text"]::placeholder{color:#7C7A86}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--borde);display:inline-flex;align-items:center;gap:8px;font-size:14px;text-align:left}
.chip-b[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-suave);color:var(--acento-texto)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}
.paso{display:flex;align-items:center;gap:2px}
.paso button{width:44px;height:44px;border-radius:50%;background:var(--sup2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.paso output{min-width:44px;text-align:center;font-size:17px;font-weight:600}
.paso.ancho{width:100%;justify-content:space-between}
.paso.ancho output{flex:1;font-size:15px;display:flex;flex-direction:column;line-height:1.3}
.paso.ancho output small{font-size:12px;color:var(--tenue);font-weight:400}
.nota{font-size:12px;color:var(--tenue)}
.error{color:var(--peligro);font-size:13px;margin-top:14px}
.pie{position:sticky;bottom:0;background:var(--sup);margin-top:12px;padding:12px 0 14px}
.pie2{display:flex;justify-content:center;padding-bottom:10px}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.col .paso{width:100%}
.col .paso output{flex:1;min-width:24px}
.muestras{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin:0 -4px}
.muestra{height:44px;display:flex;align-items:center;justify-content:center}
.muestra span{width:28px;height:28px;border-radius:50%}
.muestra[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--sup),0 0 0 4px var(--texto)}
.capa.completa .muestra[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--fondo),0 0 0 4px var(--texto)}
.aj-etq{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.muestra-auto{min-height:44px;padding:0 0 0 12px;display:flex;align-items:center}
.muestra-auto span{padding:5px 12px;border-radius:999px;border:1.5px solid var(--borde);font-size:13px}
.muestra-auto span{color:var(--tenue)}
.muestra-auto[aria-pressed="true"] span{border-color:var(--texto);color:var(--texto)}
.opc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--borde);margin-top:8px;min-height:56px}
.opc strong{font-size:15px}
.opc span{font-size:13px;color:var(--tenue)}
.opc[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-suave)}
.opc[aria-pressed="true"] span{color:var(--acento-texto)}
.panel{background:var(--fondo);border-radius:14px;padding:6px 14px 12px;margin-top:8px}
.resumen{font-size:13px;color:var(--tenue);margin-top:2px}
.dlg-t{font-size:17px;font-weight:700}
.dlg-p{font-size:14px;color:#C9C7D3;margin-top:8px}
.dlg-b{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* Ajustes */
.aj{margin-top:26px}
.aj h3{font-size:15px;font-weight:700;margin-bottom:10px}
.aj-prev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--sup);border-radius:16px;padding:14px 8px;margin-bottom:8px}
.aj-fila{margin-top:4px}
.aj-cat{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;text-align:left;border-bottom:1px solid var(--linea)}
.aj-cat-n{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.aj-cat-c{font-size:12px;color:var(--tenue)}
.aj-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.aj-v{text-align:center;margin-top:34px}

/* Mensajes breves */
#avisos{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.aviso{pointer-events:auto;max-width:480px;background:#EEEDF3;color:#15131C;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.aviso button{min-height:36px;padding:0 12px;border-radius:999px;background:#15131C;color:#EEEDF3;font-size:13px;font-weight:600;flex:none}

@media (prefers-reduced-motion:reduce){.compacta,.compacta.visible{transition:none}}
</style>
</head>
<body>
<div id="compacta" class="compacta" aria-hidden="true"></div>
<main id="vista"></main>
<div id="barra-pacto"></div>
<nav class="nav" aria-label="Secciones"><div class="nav-in">
<button data-a="nav" data-v="semana"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Semana</button>
<button data-a="nav" data-v="tareas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>Pendientes</button>
<button data-a="nav" data-v="analisis"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-9M12 20V5M19 20v-6"></path></svg>Análisis</button>
