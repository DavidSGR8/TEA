<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Íconos de Pactos</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
body{margin:0;padding:24px 20px 40px;background:#101014;color:#EEEDF3;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:0 0 8px}
p{color:#98969F;margin:0 0 20px}
.fila{display:flex;align-items:center;gap:16px;background:#17171D;border-radius:18px;padding:16px;margin-top:12px}
canvas{width:72px;height:72px;border-radius:16px;flex:none}
.fila div{flex:1;min-width:0}
strong{display:block}
small{color:#98969F}
button{font:inherit;font-weight:600;min-height:46px;padding:0 18px;border:0;border-radius:999px;background:#A99BE6;color:#15131C;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Íconos de Pactos</h1>
<p>Esta página crea los dos íconos PNG que necesita la app. Toca cada botón para descargarlo y luego súbelos a GitHub junto con los demás archivos, sin cambiarles el nombre.</p>
<div class="fila"><canvas id="c192" width="192" height="192"></canvas><div><strong>icon-192.png</strong><small>192 × 192 px</small></div><button data-t="192">Descargar</button></div>
<div class="fila"><canvas id="c512" width="512" height="512"></canvas><div><strong>icon-512.png</strong><small>512 × 512 px</small></div><button data-t="512">Descargar</button></div>
</main>
<script>
(function () {
  'use strict';
  // El mismo dibujo que icon.svg. Si cambias uno, cambia también el otro.
  var SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">' +
    '<rect width="512" height="512" fill="#101014"/>' +
    '<circle cx="256" cy="256" r="118" fill="none" stroke="#2A2935" stroke-width="40"/>' +
    '<circle cx="256" cy="256" r="118" fill="none" stroke="#A99BE6" stroke-width="40" stroke-linecap="round" stroke-dasharray="556 742" transform="rotate(-90 256 256)"/>' +
    '<circle cx="256" cy="256" r="30" fill="#A99BE6"/></svg>';
  var img = new Image();
  img.onload = function () {
    [192, 512].forEach(function (t) {
      document.getElementById('c' + t).getContext('2d').drawImage(img, 0, 0, t, t);
    });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG);

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-t]');
    if (!b) return;
    var t = b.getAttribute('data-t');
    document.getElementById('c' + t).toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'icon-' + t + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, 'image/png');
  });
})();
</script>
</body>
</html>
